# To be used in smpl_conversion/evaluation/evaluate_all_training_runs.py
checkpoint: "path/to/checkpoint" # overwritten by script
dataset:
  smplx:
    - <smplx_dataset_1>.npz
    - ...
    - <smplx_dataset_n>.npz
  smplh:
    - <smplh_dataset>.npz
  smpl:
    - ...
  supr:
    - ...
  star:
    - ...
body_model_location: <path-to-body-models>
transfer_file_location: <path-to-body-models>/transfer
verbosity: 1
dataset_device: "cuda"
inference_device: "auto"
evaluation:
  batch_size: 512
  metric_names: ["vertex", "edge"] # "mse"
  show_vertex_error_distribution: true
  set_error_of_invalid_vertices_to_zero: False
  tqdm_mode: 'shell'
  result_save_location: result/save/path # overwritten by Experiment Directory Manager
  previous_save_location: null
  overwrite_existing_results: false
  log_translation: false
  shape_components_to_log: 0
  joints_to_log: []
